name: refresh-direct
on:
  schedule:
    - cron: "17 * * * *"      # 每小时自动刷新一次直链
  workflow_dispatch:          # 也支持手动点一次
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 取直链
        env:
          MIX_IDS: '[{"id":"7669019617909540899","season":1,"include":[[25,33]]},{"id":"7670150022856214564","season":2}]'
        run: python3 tools/refresh_direct.py
      - name: 提交
        run: |
          git config user.name "wow-bot"
          git config user.email "bot@local"
          git add direct.json
          if git diff --cached --quiet; then
            echo "直链无变化，跳过提交"
          else
            git commit -m "chore: 刷新直链 $(date -u +%F_%H:%M)UTC"
            git push
          fi
