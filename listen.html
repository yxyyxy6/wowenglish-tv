<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>熏听 · Wow English TV</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#000;color:#fff;height:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Helvetica,sans-serif;
       display:flex;flex-direction:column;user-select:none}
  /* 关键：用 audio 元素播同一个 mp4——只出声、不渲染视频图层，
     屏幕镜像不会被视频画面层拦截（视频 layer 才是掉到十几 KB 的元凶） */
  #player{display:none}
  #veil{position:fixed;inset:0;background:#000;z-index:1}
  .ui{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;
      padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px);
      transition:opacity .5s ease}
  .ui.dim{opacity:0;pointer-events:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:24px}
  .back{color:rgba(255,255,255,.45);text-decoration:none;font-size:13px}
  .now{color:rgba(255,255,255,.5);font-size:13px;text-align:right}
  .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  .ear{font-size:56px}
  .num{font-size:30px;font-weight:700;letter-spacing:1px}
  .sub{font-size:13px;color:rgba(255,255,255,.45);text-align:center}
  .ctrls{display:flex;align-items:center;justify-content:center;gap:34px;padding:6px 0 22px}
  .btn{background:rgba(255,255,255,.08);border:0;color:#fff;font-size:20px;width:56px;height:56px;
       border-radius:50%;display:flex;align-items:center;justify-content:center}
  .btn.main{width:76px;height:76px;font-size:30px;background:rgba(255,255,255,.14)}
  .btn:active{transform:scale(.94)}
  .wide{width:auto;height:44px;border-radius:999px;padding:0 22px;font-size:15px;gap:8px;
        background:rgba(255,255,255,.14);margin-bottom:10px}
  .row{display:flex;gap:8px;padding:2px 0 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08);
        color:rgba(255,255,255,.7);font-size:13px;border:0;white-space:nowrap}
  .chip.on{background:#fff;color:#000;font-weight:600}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
        color:rgba(255,255,255,.4);font-size:12px;padding-bottom:4px}
  .seg{display:flex;border:1px solid rgba(255,255,255,.18);border-radius:999px;overflow:hidden}
  .seg button{border:0;background:transparent;color:rgba(255,255,255,.5);font-size:12px;padding:6px 12px}
  .seg button.on{background:#fff;color:#000;font-weight:600}
  .tips{color:rgba(255,255,255,.32);font-size:11px;text-align:center;margin:0 0 8px}
  #tip{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);text-align:center;
       color:#ffb4b4;font-size:12px;z-index:3;display:none}
</style>
</head>
<body>
<audio id="player" preload="auto" x-webkit-airplay="allow" referrerpolicy="no-referrer"></audio>
<div id="veil"></div>

<div class="ui" id="ui">
  <div class="top">
    <a class="back" href="index.html">← 工作台</a>
    <div class="now" id="status">就绪</div>
  </div>
  <div class="mid">
    <div class="ear">👂</div>
    <div class="num" id="title">熏听模式</div>
    <div class="sub" id="hint">选一集，点 ▶ 开始（首次加载可能要十几秒）</div>
  </div>
  <div class="ctrls" style="padding-bottom:8px">
    <button class="btn" id="prev" title="上一集">⏮</button>
    <button class="btn main" id="play" title="本机播放/暂停">▶</button>
    <button class="btn" id="next" title="下一集">⏭</button>
  </div>
  <div style="text-align:center">
    <button class="wide" id="tvBtn">📺 电视投屏（原生播放器 · 不掉速）</button>
  </div>
  <div class="row" id="list"></div>
  <p class="tips">长时间熏听：把 iPhone「设置→显示与亮度→自动锁定」设为「永不」，避免熄屏断音</p>
  <div class="foot">
    <span id="msg">音频用小文件优先，播不动自动换源</span>
    <div class="seg" id="modeSeg">
      <button data-m="single" class="on">单集循环</button>
      <button data-m="seq">连续播放</button>
    </div>
  </div>
</div>
<div id="tip"></div>

<script>
(function(){
  'use strict';
  var DEFAULT_EPISODES = [
    {n:'025',t:'Wow English 第一季 第25集',videoId:'v0300fg10000d9k7utnog65s79brsv7g',line:0},
    {n:'026',t:'Wow English 第一季 第26集',videoId:'v0300fg10000d9kudfnog65rlkr8br8g',line:0},
    {n:'027',t:'Wow English 第一季 第27集',videoId:'v0300fg10000d9kvc4vog65hotcem630',line:0},
    {n:'028',t:'Wow English 第一季 第28集',videoId:'v0300fg10000d9lhbefog65ofmnek4k0',line:0},
    {n:'029',t:'Wow English 第一季 第29集',videoId:'v0300fg10000da60lvfog65n66njripg',line:1},
    {n:'030',t:'Wow English 第一季 第30集',videoId:'v0300fg10000d9m9h5vog65vlupu1g00',line:0},
    {n:'031',t:'Wow English 第一季 第31集',videoId:'v0300fg10000d9ma2hvog65mgb2r5o60',line:0},
    {n:'032',t:'Wow English 第一季 第32集',videoId:'v0300fg10000d9mt49vog65qfmrlnqg0',line:0},
    {n:'033',t:'Wow English 第一季 第33集',videoId:'v0300fg10000d9mubpfog65njagdv0dg',line:1}
  ];

  // 优先从工作台读列表：两个页面同源，localStorage 共享。
  // 以后在工作台加 100 集，这里自动跟着有，不用维护两份。
  function loadEpisodes(){
    try{
      var raw = localStorage.getItem('wow.videos');
      if(raw){
        var arr = JSON.parse(raw) || [];
        var list = [];
        arr.forEach(function(v){
          if(v && v.videoId){
            list.push({n:v.number||'', t:v.title||'', videoId:v.videoId, line:(typeof v.line==='number'?v.line:0)});
          }
        });
        if(list.length) return list;
      }
    }catch(e){}
    return DEFAULT_EPISODES;
  }
  var EPISODES = loadEpisodes();
  // 候选顺序：已验证可用的 540p 优先，两条线路都失败再试小文件
  function candidates(ep){
    var alt = ep.line === 0 ? 1 : 0;
    return [
      {l:ep.line, r:'540p'},
      {l:alt,     r:'540p'},
      {l:ep.line, r:'360p'},
      {l:alt,     r:'360p'},
      {l:ep.line, r:'480p'},
      {l:alt,     r:'480p'}
    ];
  }

  var player = document.getElementById('player');
  var elTitle = document.getElementById('title');
  var elHint  = document.getElementById('hint');
  var elStatus= document.getElementById('status');
  var elPlay  = document.getElementById('play');
  var elMsg   = document.getElementById('msg');
  var elTip   = document.getElementById('tip');
  var ui      = document.getElementById('ui');

  var idx = 0, mode = 'single';
  var cands = [], ci = 0, gen = 0, loadTimer = null;
  try{
    var saved = parseInt(localStorage.getItem('wow.listenIdx'),10);
    if(!isNaN(saved) && saved>=0 && saved<EPISODES.length) idx = saved;
    var m = localStorage.getItem('wow.listenMode');
    if(m==='single'||m==='seq') mode = m;
  }catch(e){}

  function url(vid,line,ratio){
    return 'https://aweme.snssdk.com/aweme/v1/playwm/?video_id='+vid+'&ratio='+ratio+'&line='+line;
  }
  function setPlaying(on){ elPlay.textContent = on ? '⏸' : '▶'; }
  function statusTx(s){ elStatus.textContent = s; }
  function tip(t){
    elTip.textContent = t; elTip.style.display = 'block';
    setTimeout(function(){ elTip.style.display = 'none'; }, 3200);
  }

  // iOS 关键：必须在用户点击的手势里直接 play()，不能等 canplay
  function startPlay(){
    clearTimeout(loadTimer);
    gen++;
    cands = candidates(EPISODES[idx]); ci = 0;
    attempt();
  }
  function attempt(){
    var myGen = gen, c = cands[ci];
    statusTx('加载中 · ' + c.r + '线路' + c.l);
    elMsg.textContent = '连不上会自动换下一个源';
    player.src = url(EPISODES[idx].videoId, c.l, c.r);
    player.load();
    var p = player.play();
    if(p && p.catch){
      p.catch(function(err){
        if(myGen !== gen) return;
        if(err && err.name === 'NotAllowedError'){
          tip('iPhone 限制：请再点一下 ▶');
        }else{
          nextSource();
        }
      });
    }
    clearTimeout(loadTimer);
    loadTimer = setTimeout(function(){ if(myGen === gen) nextSource(); }, 30000);
  }
  function nextSource(){
    clearTimeout(loadTimer);
    ci++;
    if(ci >= cands.length){
      statusTx('加载失败');
      elMsg.textContent = '全部线路取不到，检查网络后点 ▶ 重试';
      return;
    }
    attempt();
  }

  player.addEventListener('error', function(){ if(cands.length) nextSource(); });
  player.addEventListener('playing', function(){
    clearTimeout(loadTimer); setPlaying(true); statusTx('播放中'); elMsg.textContent = '音频已就绪';
  });
  player.addEventListener('pause', function(){ setPlaying(false); statusTx('已暂停'); });
  player.addEventListener('waiting', function(){ elMsg.textContent = '缓冲中…'; });
  player.addEventListener('ended', function(){
    if(mode === 'single'){ player.currentTime = 0; player.play(); }
    else { pick(idx+1); }
  });

  function pick(i){
    idx = (i + EPISODES.length) % EPISODES.length;
    try{ localStorage.setItem('wow.listenIdx', String(idx)); }catch(e){}
    var ep = EPISODES[idx];
    elTitle.textContent = '第' + ep.n + '集';
    elHint.textContent = ep.t;
    Array.prototype.forEach.call(document.querySelectorAll('#list .chip'), function(b,k){
      b.className = 'chip' + (k===idx ? ' on' : '');
    });
    clearTimeout(loadTimer); gen++; // 作废旧的加载流程
    startPlay(); // 选集即播（用户手势内）
  }

  elPlay.addEventListener('click', function(){
    if(player.paused){
      if(!player.src){ startPlay(); return; }
      var p = player.play();
      if(p && p.catch){
        p.catch(function(){ startPlay(); });
      }
      setPlaying(true);
    }else{
      player.pause();
    }
  });
  document.getElementById('prev').addEventListener('click', function(){ pick(idx-1); });
  document.getElementById('next').addEventListener('click', function(){ pick(idx+1); });

  // 电视投屏：走已验证「不掉速」的原生播放器通道（window.open 直接甩 MP4 直链）
  document.getElementById('tvBtn').addEventListener('click', function(){
    var ep = EPISODES[idx];
    window.open(url(ep.videoId, ep.line, '540p'), '_blank');
    tip('已用原生播放器打开：电视会出画面，用遥控器把画面关掉（仅听音频/熄屏播放）即可全黑出声');
  });

  // 选集
  var listEl = document.getElementById('list');
  EPISODES.forEach(function(ep,i){
    var b = document.createElement('button');
    b.className = 'chip'; b.textContent = '第' + ep.n + '集';
    b.addEventListener('click', function(){ pick(i); });
    listEl.appendChild(b);
  });
  // 模式
  var seg = document.getElementById('modeSeg');
  Array.prototype.forEach.call(seg.querySelectorAll('button'), function(b){
    b.className = (b.getAttribute('data-m') === mode) ? 'on' : '';
    b.addEventListener('click', function(){
      mode = b.getAttribute('data-m');
      try{ localStorage.setItem('wow.listenMode', mode); }catch(e){}
      Array.prototype.forEach.call(seg.querySelectorAll('button'), function(x){
        x.className = (x.getAttribute('data-m') === mode) ? 'on' : '';
      });
      elMsg.textContent = mode === 'single' ? '单集循环：反复听这一集' : '连续播放：自动听下一集';
    });
  });

  // 静止若干秒后控制淡出 → 电视只剩纯黑；点一下呼出
  var idle = null;
  function wake(){
    ui.classList.remove('dim');
    if(idle) clearTimeout(idle);
    idle = setTimeout(function(){ ui.classList.add('dim'); }, 8000);
  }
  document.addEventListener('click', wake);
  document.addEventListener('touchstart', wake, {passive:true});
  wake();

  // 初始化：只高亮上次那集，不自动播（iOS 要求手势）
  (function init(){
    // 支持 ?ep=025 —— 工作台每行的「熏听」按钮会把集数带过来
    var m = (location.search || '').match(/ep=([^&]+)/);
    if(m){
      var target = decodeURIComponent(m[1] || '');
      for(var i=0;i<EPISODES.length;i++){
        if(EPISODES[i].n === target){ idx = i; break; }
      }
    }
    var ep = EPISODES[idx];
    elTitle.textContent = '第' + ep.n + '集';
    elHint.textContent = ep.t;
    Array.prototype.forEach.call(document.querySelectorAll('#list .chip'), function(b,k){
      var on = (k===idx);
      b.className = 'chip' + (on ? ' on' : '');
      if(on && b.scrollIntoView){ try{ b.scrollIntoView({inline:'center', block:'nearest'}); }catch(e){} }
    });
  })();
})();
</script>
</body>
</html>
