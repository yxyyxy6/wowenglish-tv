<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>连播 · Wow English TV</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:18px;background:#0f1115;color:#e8e8ea;
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:14px;line-height:1.6}
  h1{font-size:17px;margin:0 0 4px}
  .muted{color:#8b8f98;font-size:12px}
  .card{background:#171a21;border-radius:12px;padding:14px;margin:12px 0}
  button{background:#2a3038;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;margin:4px 4px 0 0}
  button.go{background:#3b82f6;font-weight:600}
  button.warn{background:#ef4444}
  select{background:#0f1115;color:#fff;border:1px solid #2a3038;border-radius:8px;padding:9px;font-size:15px;width:100%}
  .seg{display:flex;gap:6px;margin-top:8px}
  .seg button{flex:1;margin:0;font-size:13px;padding:10px 6px;background:#2a3038}
  .seg button.on{background:#3b82f6;font-weight:600}
  .now{font-size:24px;font-weight:700;margin:6px 0 2px}
  .cd{font-size:13px;color:#ffd166}
  .eps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .ep{padding:5px 10px;border-radius:999px;background:#2a3038;font-size:12px;color:#9aa0aa}
  .ep.on{background:#3b82f6;color:#fff;font-weight:600}
  .ep.done{background:#1c3f2b;color:#7ee2a8}
  #log{background:#0b0d11;border:1px solid #23272f;border-radius:10px;padding:10px;font-size:12px;
       white-space:pre-wrap;max-height:220px;overflow:auto;color:#9ee6a0;margin-top:8px}
  .bad{color:#ff8f8f}.warn2{color:#ffd166}
  a{color:#6ea8fe}
</style>
</head>
<body>
<h1>🎯 分组连播</h1>
<p class="muted">选一组 → 点开始 → 按每集真实时长<b>自动接下一集</b>，全程不用管。</p>

<div class="card">
  <div class="muted" style="margin-bottom:6px">选择分组</div>
  <select id="groupSel"></select>
  <div class="muted" style="margin:10px 0 4px">这一组播完之后</div>
  <div class="seg" id="modeSeg">
    <button data-m="stop">播完就停</button>
    <button data-m="loop">整组循环</button>
    <button data-m="next">接下一组</button>
  </div>
</div>

<div class="card">
  <div class="now" id="nowTx">未开始</div>
  <div class="cd" id="cdTx">—</div>
  <div class="eps" id="epChips"></div>
  <div style="margin-top:12px">
    <button class="go" id="startBtn">▶ 开始连播</button>
    <button id="nextBtn">下一集</button>
    <button class="warn" id="stopBtn">停止</button>
  </div>
</div>

<div class="card">
  <div class="muted" style="margin-bottom:6px">运行日志</div>
  <div id="log">（等待开始…）</div>
  <p class="muted" style="margin:10px 0 0">
    <a href="index.html">← 回工作台管理分组</a><br>
    连播期间请保持这个页面开着（切到别的标签页也不影响计时）。
  </p>
</div>

<script>
(function(){
  'use strict';
  var videos = [], groups = [], group = null;
  var w = null, idx = 0, timer = null, tick = null, deadline = 0;
  var mode = 'stop';
  var el = {
    sel: document.getElementById('groupSel'),
    nowTx: document.getElementById('nowTx'),
    cdTx: document.getElementById('cdTx'),
    chips: document.getElementById('epChips'),
    log: document.getElementById('log'),
    seg: document.getElementById('modeSeg')
  };

  function log(msg, cls){
    var t = new Date().toTimeString().slice(0,8);
    var s = document.createElement('div');
    if(cls) s.className = cls;
    s.textContent = '[' + t + '] ' + msg;
    el.log.appendChild(s);
    el.log.scrollTop = el.log.scrollHeight;
  }
  function lsGet(k, def){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
  function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  videos = (lsGet('wow.videos', []) || []).filter(function(v){ return v && v.videoId; });
  groups = lsGet('wow.groups', []) || [];
  mode = lsGet('wow.playMode', 'stop');

  function url(v){
    return 'https://aweme.snssdk.com/aweme/v1/playwm/?video_id=' + v.videoId + '&ratio=540p&line=' + (v.line || 0);
  }
  function epById(id){ return videos.filter(function(v){ return v.id === id; })[0]; }
  function groupEps(g){ return (g.eps || []).map(epById).filter(Boolean); }
  function sec(v){ return (v && v.sec) ? v.sec : 300; }

  if(groups.length === 0){
    el.sel.innerHTML = '<option>（还没有分组）</option>';
    log('工作台里还没有分组，先去「连播分组」建一个', 'warn2');
  }else{
    el.sel.innerHTML = groups.map(function(g){
      return '<option value="' + g.id + '">' + g.name + '（' + (g.eps||[]).length + '集）</option>';
    }).join('');
    var q = (location.search || '').match(/g=([^&]+)/);
    var pickId = q ? decodeURIComponent(q[1]) : lsGet('wow.playGroup', null);
    if(pickId && groups.some(function(g){ return g.id === pickId; })) el.sel.value = pickId;
  }
  Array.prototype.forEach.call(el.seg.querySelectorAll('button'), function(b){
    b.className = (b.getAttribute('data-m') === mode) ? 'on' : '';
    b.addEventListener('click', function(){
      mode = b.getAttribute('data-m');
      lsSet('wow.playMode', mode);
      Array.prototype.forEach.call(el.seg.querySelectorAll('button'), function(x){
        x.className = (x.getAttribute('data-m') === mode) ? 'on' : '';
      });
      log('播完行为改为：' + (mode === 'stop' ? '播完就停' : mode === 'loop' ? '整组循环' : '自动接下一组'));
    });
  });
  el.sel.addEventListener('change', function(){
    group = groups.filter(function(g){ return g.id === el.sel.value; })[0] || null;
    lsSet('wow.playGroup', el.sel.value);
    idx = 0; renderChips(); log('切换到分组：' + (group ? group.name : '—'));
  });
  group = groups.filter(function(g){ return g.id === el.sel.value; })[0] || null;

  function renderChips(){
    if(!group){ el.chips.innerHTML=''; el.nowTx.textContent='未开始'; return; }
    var eps = groupEps(group);
    el.chips.innerHTML = eps.map(function(v, i){
      var cls = i === idx ? 'ep on' : (i < idx ? 'ep done' : 'ep');
      return '<span class="' + cls + '">' + v.number + '</span>';
    }).join('');
    var cur = eps[idx];
    el.nowTx.textContent = cur ? ('正在播放：第 ' + cur.number + ' 集（' + (idx+1) + '/' + eps.length + '）') : '未开始';
  }

  function startTick(){
    clearInterval(tick);
    tick = setInterval(function(){
      if(!deadline){ el.cdTx.textContent = '—'; return; }
      var left = Math.round((deadline - Date.now()) / 1000);
      el.cdTx.textContent = left > 0 ? ('距下一集约 ' + left + ' 秒') : '即将切换…';
    }, 1000);
  }
  function openCurrent(){
    var eps = groupEps(group), v = eps[idx];
    if(!v) return false;
    log('打开 第' + v.number + '集（时长约 ' + sec(v) + ' 秒）');
    w = window.open(url(v), '_blank');
    if(!w){ log('✗ 打开失败（被浏览器拦截）。请回到本页再点「开始连播」', 'bad'); return false; }
    deadline = Date.now() + sec(v) * 1000;
    renderChips(); startTick();
    return true;
  }
  function switchTo(v){
    if(!w || w.closed){
      log('⚠ 播放窗口丢失，尝试重开…', 'warn2');
      if(!openCurrent()) stopAll('窗口无法恢复，已停止');
      return;
    }
    try{
      w.location.replace(url(v));
      log('✓ 已切到 第' + v.number + '集');
      deadline = Date.now() + sec(v) * 1000;
      renderChips();
    }catch(e){
      log('✗ 切换被拒：' + (e && e.name) + '，尝试重开窗口…', 'bad');
      if(!openCurrent()) stopAll('切换失败，已停止');
    }
  }
  function scheduleNext(){
    clearTimeout(timer);
    var eps = groupEps(group), v = eps[idx];
    timer = setTimeout(function(){
      idx++;
      if(idx < eps.length){ switchTo(eps[idx]); scheduleNext(); return; }
      if(mode === 'loop'){
        idx = 0;
        log('整组播完，回到第 ' + eps[0].number + ' 集重播');
        switchTo(eps[0]); scheduleNext(); return;
      }
      if(mode === 'next'){
        var gi = groups.indexOf(group);
        if(gi >= 0 && gi + 1 < groups.length){
          group = groups[gi + 1]; idx = 0;
          el.sel.value = group.id; lsSet('wow.playGroup', group.id);
          log('本组播完，自动接下一组：' + group.name);
          renderChips();
          if(openCurrent()) scheduleNext();
          return;
        }
        log('已经是最后一组，结束');
      }
      stopAll('全部播完');
    }, sec(v) * 1000);
  }
  function stopAll(msg){
    clearTimeout(timer); clearInterval(tick);
    deadline = 0; el.cdTx.textContent = '—';
    log(msg || '已停止');
  }

  document.getElementById('startBtn').addEventListener('click', function(){
    if(!group){ log('请先在工作台「连播分组」里建一个分组', 'warn2'); return; }
    idx = 0; renderChips();
    log('▶ 开始连播：' + group.name + '（' + groupEps(group).length + ' 集）');
    if(openCurrent()) scheduleNext();
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    if(!group) return;
    var eps = groupEps(group);
    idx = (idx + 1) % eps.length;
    switchTo(eps[idx]);
    clearTimeout(timer); scheduleNext();
  });
  document.getElementById('stopBtn').addEventListener('click', function(){ stopAll('已手动停止'); });

  renderChips();
  log('就绪：' + (group ? ('当前分组 ' + group.name) : '请先选/建分组'));
})();
</script>
</body>
</html>
